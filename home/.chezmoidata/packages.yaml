packages:
  pacman:
    # Hyprland core
    # hyprlock / hypridle / hyprpolkitagent / hyprsunset / hyprpaper đã bỏ:
    # DMS lo lock screen, idle/sleep, polkit agent, night mode và wallpaper.
    - hyprland
    - xdg-desktop-portal-hyprland
    # Shell: DankMaterialShell (thay waybar + rofi + fuzzel + swaync + wlogout)
    # dms-shell-hyprland kéo theo dms-shell, quickshell, dgop, accountsservice
    - dms-shell-hyprland
    - matugen              # DMS dùng để sinh theme Material You từ wallpaper
    - cava                 # audio visualizer trong DMS
    - wtype                # DMS paste từ lịch sử clipboard
    - kimageformats        # thêm định dạng ảnh cho wallpaper
    - qt6ct                # để DMS theme được app Qt
    # Terminal & shell
    - wezterm
    - kitty
    - alacritty
    - zsh
    - starship
    - tmux
    # Utilities
    - wl-clipboard
    - grim
    - slurp
    - swappy
    - brightnessctl
    - playerctl
    - wireplumber
    - pavucontrol
    - socat
    - jq
    - python
    - fzf
    - eza
    - bat
    - unzip
    - git
    - base-devel
    # System
    - networkmanager
    - bluez
    - bluez-utils
    - blueman
    - power-profiles-daemon
    # Apps
    - nautilus
    # Input method
    - fcitx5
    - fcitx5-configtool
    - fcitx5-bamboo
    - fcitx5-gtk
    - fcitx5-qt
    # Fonts
    # DMS settings.json đặt fontFamily="Inter Variable", monoFontFamily="Fira Code"
    - inter-font
    - ttf-fira-code
    - ttf-jetbrains-mono-nerd
    - noto-fonts
    - noto-fonts-cjk
    - noto-fonts-emoji
    # Theming
    - papirus-icon-theme
    - adw-gtk-theme         # thay adw-gtk3 (AUR cu da bi xoa, nay co trong extra)
    # Boot & hệ thống nền — thiếu nhóm này thì máy cài lại không boot được
    - grub
    - efibootmgr
    - sddm
    - amd-ucode
    - zram-generator
    - linux
    - linux-firmware
    - btrfs-progs
    # Đồ hoạ lai: AMD Picasso iGPU (amdgpu) + NVIDIA GTX 1650 Mobile (nouveau).
    # SDDM đang chạy trên X11 (có tiến trình Xorg) nên vẫn cần DDX driver.
    # xf86-video-ati là rác archinstall để lại (dành cho Radeon đời pre-GCN) -> không track.
    - xorg-server
    - xf86-video-amdgpu
    - xf86-video-nouveau
    - mesa
    - vulkan-radeon
    # Snapshot / rollback (xem README mục Rollback)
    - snapper
    - snap-pac
    - grub-btrfs
    - inotify-tools
    # Công cụ
    - chezmoi
    - github-cli
    - htop
    - wget
    - nano
    - dolphin
    - ghostty
    - uwsm

  aur:
    # awww / wlogout / hyprshot / kde-material-you-colors đã bỏ:
    # DMS lo wallpaper, power menu, screenshot và màu KDE (kcolorscheme).
    #
    # Đã gỡ 3 gói AUR không còn tồn tại (kiểm tra qua AUR RPC 2026-08-29):
    #   adw-gtk3            -> thay bằng extra/adw-gtk-theme ở trên
    #   ttf-google-sans-flex -> không còn, chưa có gói thay thế
    #   wezterm-cursor-trail -> không còn, dùng extra/wezterm thường
    - hyprswitch                        # alt-tab, DMS không thay thế
    - ttf-material-symbols-variable-git
    - google-chrome
