# Laptop (dùng chung cho các máy đặt hostname "vchun")
#
# eDP-1 dùng "preferred" thay vì pin cứng mode: hai laptop có panel khác nhau
# (1920x1200@60 và 1920x1080@120), preferred để mỗi máy tự lấy đúng mode gốc.
monitor=eDP-1,preferred,0x0,1.0

# Màn ngoài khớp theo desc: nên chỉ áp dụng khi thực sự cắm vào.
monitor=desc:LG Electronics LG ULTRAFINE 311NTGY17871,3840x2160@60,1920x0,1.25
monitor=desc:GWD ARZOPA 000000000000,1920x1080@60,auto,1,transform,1

# Màn hình lạ chưa khai báo: bật với mode mặc định thay vì bị bỏ qua.
monitor=,preferred,auto,1
