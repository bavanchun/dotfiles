# Kiểu gõ: Telex (phổ biến nhất ở VN). Đổi sang "VNI", "VIQR", "Telex 2",
# "Telex W" hoặc "Telex + VNI + VIQR" nếu muốn.
InputMethod=Telex
# Bảng mã: Unicode dựng sẵn. TCVN3/VNI Windows chỉ dùng cho file cũ.
OutputCharset=Unicode
# Chặn tổ hợp không phải tiếng Việt -> gõ "hello", "config" không bị bẻ dấu.
SpellCheck=True
# Tự trả về nguyên văn khi từ không hợp lệ tiếng Việt. Cặp đôi với SpellCheck,
# đây là thứ làm việc gõ lẫn Anh-Việt trong một câu trở nên trơn tru.
AutoNonVnRestore=True
# False = kiểu bỏ dấu truyền thống ("hòa", "thúy"). True = kiểu mới ("hoà", "thuý").
ModernStyle=False
